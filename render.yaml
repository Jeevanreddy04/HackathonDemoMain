databases:
  - name: hackathon-postgres
    databaseName: hackathon_02cr
    user: hackathon_02cr_user
    plan: free

services:
  - type: web
    name: hackathon-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: hackathon-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hackathon-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hackathon-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hackathon-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hackathon-postgres
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://hackathon-frontend.onrender.com

  - type: static
    name: hackathon-frontend
    rootDir: frontend
    buildCommand: npm ci; npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hackathon-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
